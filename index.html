<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505"><title>Nano Display</title>
<style>
:root{--bg:#050505;--fg:#f2f2f0;--mut:#77776f;--line:#222220}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:"Helvetica Neue",Arial,system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
#app{height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom)}
.top{display:flex;align-items:center;gap:10px;height:52px;font-size:12px;letter-spacing:.14em;color:var(--mut)}
.top i{flex:1}
.dot{width:9px;height:9px;border-radius:50%;background:#444}.dot.on{background:#5fd0a0;box-shadow:0 0 9px #5fd0a0}
button{background:none;border:1px solid #2c2c29;color:var(--fg);padding:9px 13px;font:inherit;font-size:12px;letter-spacing:.14em;border-radius:2px}
button:active{background:#1a1a18}
#main{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0}
#lab{font-size:13px;letter-spacing:.32em;color:var(--mut);margin-bottom:1.2vmin}
#name{font-weight:700;white-space:nowrap;line-height:1.05;text-transform:uppercase;overflow:hidden;font-size:22vmin}
#bl{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:8px;padding:10px 0 14px}
.b{border:1px solid var(--line);padding:12px 4px 10px;text-align:center;opacity:.3;position:relative;overflow:hidden}
.b.on{opacity:1;border-color:var(--c)}
.b.on::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--c);box-shadow:0 0 14px var(--c)}
.b svg{width:46%;max-width:66px;fill:none;stroke:var(--c);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.b span{display:block;font-size:11px;letter-spacing:.16em;margin-top:7px}
#msg{font-size:11px;color:var(--mut);letter-spacing:.08em;padding-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ov{position:fixed;inset:0;background:var(--bg);display:none;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);overflow:auto;z-index:5}
.ov.show{display:flex;flex-direction:column}
#tun{align-items:center;justify-content:center;text-align:center}
#tn{font-size:36vmin;font-weight:700;line-height:1}
#tf{color:var(--mut);letter-spacing:.2em;margin:1vmin 0 4vmin;font-size:14px}
#tb{width:86%;height:14px;border:1px solid #333;position:relative;margin-bottom:4vmin}
#tb::before{content:"";position:absolute;left:50%;top:-8px;bottom:-8px;width:2px;background:#555}
#nd{position:absolute;top:-8px;bottom:-8px;width:8px;margin-left:-4px;background:#ff7a3d;left:50%}
#nd.ok{background:#5fd0a0;box-shadow:0 0 14px #5fd0a0}
.set h3{font-size:12px;letter-spacing:.2em;color:var(--mut);font-weight:400;margin:22px 0 8px}
.row{display:flex;gap:6px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
input[type=text],input[type=number]{background:#0e0e0d;border:1px solid #2c2c29;color:var(--fg);padding:8px;font:inherit;font-size:14px;width:120px;border-radius:2px}
input[type=number]{width:64px}
.set label{font-size:11px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px}
</style></head><body>
<div id="app">
 <div class="top"><span class="dot" id="dot"></span><span id="dev">SEM MIDI</span><i></i>
  <button id="bT">AFINADOR</button><button id="bS">AJUSTES</button><button id="bF">TELA CHEIA</button></div>
 <div id="main"><div id="lab">PRESET</div><div id="name">AGUARDANDO</div></div>
 <div id="bl"></div><div id="msg"></div>
</div>
<div class="ov" id="tun"><div id="tn">–</div><div id="tf">TOQUE UMA CORDA</div><div id="tb"><div id="nd"></div></div><button id="bTx">FECHAR</button></div>
<div class="ov set" id="set"></div>
<script>
const $=s=>document.querySelector(s),KEY='nanodisp1';
const IC={gate:'<path d="M3 12h3M8 7v10M12 4v16M16 7v10M18 12h3"/>',
drive:'<rect x="6" y="3" width="12" height="18" rx="2"/><circle cx="12" cy="9" r="2.5"/><circle cx="12" cy="16" r="1.4"/>',
amp:'<rect x="3" y="6" width="18" height="12" rx="1.5"/><circle cx="7.5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="16.5" cy="12" r="1.2"/>',
cab:'<rect x="4" y="3" width="16" height="18" rx="1.5"/><circle cx="12" cy="13.5" r="4.5"/><circle cx="12" cy="13.5" r="1"/><path d="M8 6.5h8"/>',
eq:'<path d="M6 3v18M12 3v18M18 3v18"/><rect x="4" y="13" width="4" height="3"/><rect x="10" y="6" width="4" height="3"/><rect x="16" y="10" width="4" height="3"/>',
delay:'<path d="M4 12v0M8 6v12M13 8.5v7M18 10.5v3"/>',
reverb:'<path d="M12 8a4 4 0 0 1 0 8M12 4a8 8 0 0 1 0 16M12 12h.01"/>'};
const DEF={idcc:0,blocks:[
{n:'GATE',i:'gate',c:'#9aa4ad',cc:20},{n:'DRIVE',i:'drive',c:'#ff7a3d',cc:21},{n:'AMP',i:'amp',c:'#ff4d5e',cc:22},
{n:'CAB',i:'cab',c:'#f2b84b',cc:23},{n:'EQ',i:'eq',c:'#5fd0a0',cc:24},{n:'DELAY',i:'delay',c:'#5aa9ff',cc:25},{n:'REVERB',i:'reverb',c:'#b48cff',cc:26}],
presets:[]};
let cfg=DEF;try{cfg=Object.assign({},DEF,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(cfg))}catch(e){}};
const S={id:null,cc:[]};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const cur=()=>cfg.presets.find(p=>p.id==S.id);

function fit(){const el=$('#name');el.style.fontSize='';let fs=parseFloat(getComputedStyle(el).fontSize);
 while(el.scrollWidth>el.clientWidth&&fs>16){fs-=2;el.style.fontSize=fs+'px'}}
function draw(){const p=cur();
 $('#lab').textContent=S.id===null?'PRESET':'PRESET '+S.id;
 $('#name').textContent=S.id===null?'AGUARDANDO':(p&&p.name?p.name:'PRESET '+S.id);
 $('#bl').innerHTML=cfg.blocks.map((k,i)=>{const on=S.cc[i]!==undefined?S.cc[i]:!!(p&&p.on&&p.on[i]);
  return `<div class="b${on?' on':''}" style="--c:${k.c}"><svg viewBox="0 0 24 24">${IC[k.i]||''}</svg><span>${esc(k.n)}</span></div>`}).join('');
 fit()}
function setId(v){S.id=v;draw()}
const log=t=>$('#msg').textContent=t;

function onMsg(e){const [s,a,b]=e.data,t=s&0xf0,ch=(s&15)+1;
 if(t===0xC0){log(`CH${ch} PC ${a}`);if(!cfg.idcc)setId(a)}
 else if(t===0xB0){log(`CH${ch} CC ${a} = ${b}`);
  if(cfg.idcc&&a==cfg.idcc)setId(b);
  cfg.blocks.forEach((k,i)=>{if(k.cc==a){S.cc[i]=b>=64;draw()}})}}
function bind(acc){const upd=()=>{const ins=[...acc.inputs.values()];ins.forEach(i=>i.onmidimessage=onMsg);
  $('#dot').classList.toggle('on',ins.length>0);$('#dev').textContent=ins.length?ins.map(i=>i.name).join(' + ').toUpperCase():'CONECTE O CABO USB'};
 upd();acc.onstatechange=upd}
if(navigator.requestMIDIAccess)navigator.requestMIDIAccess().then(bind,()=>$('#dev').textContent='MIDI NEGADO');
else $('#dev').textContent='USE O CHROME NO ANDROID';

/* Afinador por microfone */
const NT=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];let tun=null;
function pitch(b,sr){const n=b.length;let r=0;for(let i=0;i<n;i++)r+=b[i]*b[i];if(Math.sqrt(r/n)<.012)return 0;
 const L=Math.min(n>>1,Math.floor(sr/25)),c=new Float32Array(L);
 for(let i=0;i<L;i++){let s=0;for(let j=0;j<n-L;j++)s+=b[j]*b[j+i];c[i]=s}
 let d=1;while(d<L-1&&c[d]>c[d+1])d++;let m=-1,p=0;for(let i=d;i<L-1;i++)if(c[i]>m){m=c[i];p=i}
 if(!p||m<.3*c[0])return 0;const x1=c[p-1],x2=c[p],x3=c[p+1],a=(x1+x3-2*x2)/2,q=(x3-x1)/2;return sr/(a?p-q/(2*a):p)}
async function tOn(){$('#tun').classList.add('show');
 try{const st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
  const ac=new AudioContext(),an=ac.createAnalyser();an.fftSize=4096;ac.createMediaStreamSource(st).connect(an);
  const buf=new Float32Array(4096);let last=0;
  tun={st,ac,t:setInterval(()=>{an.getFloatTimeDomainData(buf);const f=pitch(buf,ac.sampleRate),now=Date.now();
   if(f>25&&f<1400){last=now;const n=12*Math.log2(f/440)+69,r=Math.round(n),ct=(n-r)*100;
    $('#tn').textContent=NT[((r%12)+12)%12];$('#tf').textContent=f.toFixed(1)+' HZ   '+(ct>0?'+':'')+ct.toFixed(0)+' CENTS';
    const nd=$('#nd');nd.style.left=(50+ct)+'%';nd.classList.toggle('ok',Math.abs(ct)<5)}
   else if(now-last>900){$('#tn').textContent='–';$('#tf').textContent='TOQUE UMA CORDA'}},70)}
 }catch(e){$('#tf').textContent='MICROFONE INDISPONIVEL'}}
function tOff(){$('#tun').classList.remove('show');if(tun){clearInterval(tun.t);tun.st.getTracks().forEach(t=>t.stop());tun.ac.close();tun=null}}

/* Ajustes */
function setUI(){const el=$('#set');
 el.innerHTML=`<div class="row" style="margin-top:14px"><button id="sx">FECHAR</button><button id="sd">TESTAR (DEMO)</button></div>
 <h3>EFEITOS: NOME E NUMERO DO CC (LIGADO = VALOR 64 OU MAIS)</h3>
 ${cfg.blocks.map((k,i)=>`<div class="row"><input type="text" data-bn="${i}" value="${esc(k.n)}"><input type="number" data-bc="${i}" value="${k.cc}"></div>`).join('')}
 <h3>IDENTIFICAR PRESET POR CC (0 = USAR PROGRAM CHANGE)</h3>
 <div class="row"><input type="number" id="ic" value="${cfg.idcc}"></div>
 <h3>PRESETS: NUMERO, NOME E EFEITOS LIGADOS</h3>
 ${cfg.presets.map((p,j)=>`<div class="row"><input type="number" data-pi="${j}" value="${p.id}"><input type="text" data-pn="${j}" value="${esc(p.name)}">
 ${cfg.blocks.map((k,i)=>`<label>${esc(k.n.slice(0,3))}<input type="checkbox" data-po="${j}:${i}" ${p.on&&p.on[i]?'checked':''}></label>`).join('')}
 <button data-pd="${j}">X</button></div>`).join('')}
 <div class="row"><button id="pa">+ PRESET</button></div><div style="height:30px"></div>`;
 el.onclick=e=>{const t=e.target;
  if(t.id==='sx'){el.classList.remove('show');draw()}
  if(t.id==='sd'){const ids=cfg.presets.map(p=>p.id);if(ids.length)setId(ids[(Math.max(0,ids.indexOf(+S.id))+1)%ids.length])}
  if(t.id==='pa'){const m=cfg.presets.reduce((a,p)=>Math.max(a,p.id+1),0);cfg.presets.push({id:m,name:'',on:[]});save();setUI()}
  if(t.dataset.pd!==undefined){cfg.presets.splice(+t.dataset.pd,1);save();setUI()}};
 el.oninput=e=>{const t=e.target,d=t.dataset;
  if(d.bn!==undefined)cfg.blocks[d.bn].n=t.value;if(d.bc!==undefined)cfg.blocks[d.bc].cc=+t.value;
  if(t.id==='ic')cfg.idcc=+t.value;if(d.pi!==undefined)cfg.presets[d.pi].id=+t.value;if(d.pn!==undefined)cfg.presets[d.pn].name=t.value;
  if(d.po!==undefined){const[j,i]=d.po.split(':');const p=cfg.presets[j];p.on=p.on||[];p.on[i]=t.checked}
  save()}}
$('#bS').onclick=()=>{setUI();$('#set').classList.add('show')};
$('#bT').onclick=tOn;$('#bTx').onclick=tOff;
$('#bF').onclick=()=>{const d=document.documentElement;document.fullscreenElement?document.exitFullscreen():d.requestFullscreen&&d.requestFullscreen()};
async function wake(){try{await navigator.wakeLock.request('screen')}catch(e){}}
wake();document.addEventListener('visibilitychange',()=>{if(!document.hidden)wake()});
addEventListener('resize',fit);draw();
</script></body></html>
